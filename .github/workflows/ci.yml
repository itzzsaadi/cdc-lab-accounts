name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://ci:ci_password@localhost:5432/cdc_lab_accounts_ci?schema=public"
  TEST_DATABASE_URL: "postgresql://ci:ci_password@localhost:5432/cdc_lab_accounts_ci_test?schema=public"
  # Phase 2 — non-production values for every step except Build below.
  # NODE_ENV is not "production" for `prisma generate`/`db seed`/`test`/
  # `test:e2e` (Playwright's webServer runs `next dev`), so the file-sink
  # email transport and an HTTP BETTER_AUTH_URL are valid here — see
  # src/server/auth.ts and src/lib/email/transport.ts's fail-closed guards.
  BETTER_AUTH_URL: "http://localhost:3000"
  BETTER_AUTH_SECRET: "ci-only-secret-not-used-in-any-real-deployment-0123456789"
  EMAIL_TRANSPORT: "file"

jobs:
  validate:
    runs-on: ubuntu-latest

    # Runner-provided CI infrastructure (Phase 1 plan §"Test-database
    # plan"), not a project dependency — analogous to Playwright's browser
    # binaries below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: cdc_lab_accounts_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prisma schema format check
        run: |
          npx prisma format
          git diff --exit-code -- prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create the dedicated test database
        run: PGPASSWORD=ci_password psql -h localhost -U ci -d cdc_lab_accounts_ci -c "CREATE DATABASE cdc_lab_accounts_ci_test;"

      - name: Apply migrations (dev-equivalent database)
        run: npx prisma migrate deploy

      - name: Apply migrations (test database)
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Verify no migration drift
        run: npx prisma migrate status

      - name: Seed master data (dev-equivalent database)
        run: npx prisma db seed

      - name: Build
        # next build sets NODE_ENV=production internally, so the
        # production-only startup guards in src/server/auth.ts fire here —
        # an HTTPS BETTER_AUTH_URL and complete (placeholder, never
        # connected-to) SMTP configuration are required for this one step
        # only. Every other step keeps the job-level, non-production values
        # above.
        run: npm run build
        env:
          BETTER_AUTH_URL: "https://ci-build-placeholder.example"
          EMAIL_TRANSPORT: "smtp"
          SMTP_HOST: "smtp.ci-build-placeholder.example"
          SMTP_PORT: "587"
          SMTP_USER: "ci"
          SMTP_PASSWORD: "ci"
          SMTP_FROM: "noreply@ci-build-placeholder.example"

      - name: Unit, integration, and constraint tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
