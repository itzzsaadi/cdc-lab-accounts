name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Syntactically valid placeholder — Phase 0 has no models, so
  # `prisma validate`/`prisma format` never need a reachable database.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/cdc_lab_accounts_ci?schema=public"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
