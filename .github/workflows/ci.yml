name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://ci:ci_password@localhost:5432/cdc_lab_accounts_ci?schema=public"
  BETTER_AUTH_URL: "https://ci-build-placeholder.example"
  BETTER_AUTH_SECRET: "ci-only-secret-not-used-in-any-real-deployment-0123456789"
  EMAIL_TRANSPORT: "smtp"
  SMTP_HOST: "smtp.ci-build-placeholder.example"
  SMTP_PORT: "587"
  SMTP_USER: "ci"
  SMTP_PASSWORD: "ci"
  SMTP_FROM: "noreply@ci-build-placeholder.example"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Generated before any other step: the schema uses a custom-output
      # generator (prisma/schema.prisma's `output = "../generated/prisma"`),
      # which — unlike the classic default-output @prisma/client package —
      # is not produced by any package-install postinstall hook. Type check
      # and lint both resolve types from this generated client, so it must
      # exist before either runs, not merely before the build step that
      # uses it at runtime.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prisma schema format check
        run: |
          npx prisma format
          git diff --exit-code -- prisma/schema.prisma

      - name: Build
        run: npm run build
