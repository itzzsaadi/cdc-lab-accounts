<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - CDC Laboratories</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#d3e4fe",
                    "secondary-fixed-dim": "#adcae7",
                    "secondary": "#46617a",
                    "primary-fixed-dim": "#80d5cb",
                    "on-surface-variant": "#3e4947",
                    "on-secondary-fixed-variant": "#2e4961",
                    "surface": "#f8f9ff",
                    "on-error-container": "#93000a",
                    "secondary-container": "#c3e0fe",
                    "on-error": "#ffffff",
                    "inverse-primary": "#80d5cb",
                    "on-tertiary-fixed": "#07006c",
                    "on-tertiary-container": "#eae8ff",
                    "on-secondary-fixed": "#001d32",
                    "surface-container": "#e5eeff",
                    "on-secondary-container": "#48637d",
                    "tertiary-fixed-dim": "#c0c1ff",
                    "outline-variant": "#bdc9c6",
                    "tertiary-container": "#5457e2",
                    "inverse-on-surface": "#eaf1ff",
                    "surface-container-low": "#eff4ff",
                    "on-primary-fixed-variant": "#00504a",
                    "primary-container": "#0f766e",
                    "on-secondary": "#ffffff",
                    "surface-bright": "#f8f9ff",
                    "surface-tint": "#006a63",
                    "on-primary-fixed": "#00201d",
                    "surface-container-high": "#dce9ff",
                    "on-primary-container": "#a3faef",
                    "on-background": "#0b1c30",
                    "on-tertiary-fixed-variant": "#2f2ebe",
                    "inverse-surface": "#213145",
                    "tertiary": "#3b3bc9",
                    "surface-variant": "#d3e4fe",
                    "primary-fixed": "#9cf2e8",
                    "on-surface": "#0b1c30",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#cbdbf5",
                    "error-container": "#ffdad6",
                    "outline": "#6e7977",
                    "secondary-fixed": "#cde5ff",
                    "primary": "#005c55",
                    "background": "#f8f9ff",
                    "tertiary-fixed": "#e1e0ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "touch-target-min": "44px",
                    "header-height": "56px",
                    "base": "4px",
                    "gutter": "16px",
                    "container-margin": "24px",
                    "sidebar-width": "260px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "tabular-nums": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-sm": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "tabular-nums": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #0b1c30 !important;
        }
    </style>
</head>
<body class="bg-[#F6F8FA] min-h-screen flex flex-col justify-center items-center p-4">
<!-- Main Authentication Container -->
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-[0px_4px_12px_rgba(18,48,71,0.04)] overflow-hidden">
<!-- Header / Branding -->
<div class="p-8 pb-6 text-center border-b border-outline-variant/20">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-low mb-4">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">biotech</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">CDC Laboratories</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Access Gateway</p>
</div>
<!-- Form Area -->
<div class="p-8">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-body-sm text-body-sm font-medium text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary transition-colors h-[44px]" id="email" name="email" placeholder="user@cdclabs.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-body-sm text-body-sm font-medium text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary transition-colors h-[44px]" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Actions -->
<div class="pt-2 space-y-6">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me for 30 days
                        </label>
</div>
<button class="w-full flex justify-center items-center h-[44px] bg-primary hover:bg-primary-container text-on-primary font-body-md text-body-md font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                        Sign In
                    </button>
</div>
</form>
</div>
<!-- Footer / System Status -->
<div class="bg-surface-container-low px-8 py-4 border-t border-outline-variant/20 flex justify-center items-center">
<div class="flex items-center gap-2">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">System Status: Online</span>
</div>
</div>
</div>
<!-- Background Decoration (Subtle) -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] rounded-full bg-surface-container-highest opacity-50 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[30%] rounded-full bg-primary-fixed-dim opacity-20 blur-[120px]"></div>
</div>
</body></html>
